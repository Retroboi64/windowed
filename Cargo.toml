[package]
name = "windowed"
version = "0.4.0"
edition = "2024"
description = "A minimal, zero-dependency and cross-platform windowing library for Windows, Linux (X11), and macOS (Cocoa)"
license = "MIT"
authors = ["Patrick Reese (Retroboi64) <https://github.com/Retroboi64>"]
readme = "README.md"
repository = "https://github.com/Retroboi64/windowed"
documentation = "https://docs.rs/windowed"
keywords = ["window", "windowing", "x11", "win32", "zero-dependency"]
categories = ["gui", "os::windows-apis", "os::macos-apis"]

[dependencies]
gl = { version = "0.14.0", optional = true }
probably_fine_log = { version = "0.1.0", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[features]
default = []
opengl = ["gl"]
log = ["dep:probably_fine_log"]
raw-window-handle = ["dep:raw-window-handle"]
rwh_06 = ["raw-window-handle"]

[[example]]
name = "simple_window"
path = "examples/simple_window.rs"

[[example]]
name = "gl_window"
path = "examples/gl_window.rs"
required-features = ["opengl"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
